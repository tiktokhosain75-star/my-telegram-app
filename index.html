<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>QuizMaster — Premium Quiz App</title>
<style>
:root{
  --bg:#050b09;--bg2:#081510;--card:rgba(15,31,25,.88);--card2:#10271f;
  --green:#21e58a;--green2:#0ca968;--text:#f4fff9;--muted:#91aaa0;
  --danger:#ff5266;--warning:#ffc857;--line:rgba(77,220,158,.18);
  --shadow:0 18px 55px rgba(0,0,0,.42);--r:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:radial-gradient(circle at 50% -10%,#103c2c 0,#06100c 34%,#030806 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100%;overflow-x:hidden}
button,input{font:inherit}
button{border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
#app{width:100%;max-width:480px;margin:auto;min-height:100vh;position:relative;padding-bottom:86px}
.topbar{height:66px;display:flex;align-items:center;justify-content:space-between;padding:10px 15px;position:sticky;top:0;z-index:20;background:rgba(4,12,9,.78);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.04)}
.brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:20px;letter-spacing:-.5px}
.logo{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#32f39b,#08784c);box-shadow:0 7px 25px rgba(33,229,138,.22);font-size:21px}
.menuBtn{width:43px;height:43px;border-radius:14px;background:rgba(255,255,255,.06);color:#fff;font-size:21px}
.langs{display:flex;gap:5px;margin-left:auto;margin-right:8px}
.lang{padding:7px 8px;border-radius:10px;background:transparent;color:var(--muted);font-size:12px}
.lang.active{background:rgba(33,229,138,.12);color:var(--green)}
.screen{display:none;padding:16px 15px 10px;animation:pageIn .28s ease}
.screen.active{display:block}
@keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sectionTitle{font-size:19px;font-weight:850;margin:20px 2px 11px}
.sub{color:var(--muted);font-size:12px}
.card{background:linear-gradient(145deg,rgba(17,40,31,.92),rgba(7,19,14,.9));border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);position:relative;overflow:hidden}
.profileCard{padding:17px;display:flex;align-items:center;gap:13px}
.avatar{width:52px;height:52px;border-radius:17px;background:linear-gradient(145deg,#21e58a,#0b6d48);display:grid;place-items:center;font-size:25px;font-weight:900}
.profileMain{flex:1;min-width:0}.profileName{font-weight:800;font-size:16px}.rank{font-size:11px;color:var(--muted);margin-top:3px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:13px}
.stat{padding:9px 5px;text-align:center;border-radius:13px;background:rgba(255,255,255,.045);font-size:11px;color:var(--muted)}
.stat b{display:block;color:#fff;font-size:14px;margin-bottom:2px}
.notice{margin-top:13px;padding:11px 13px;border-radius:16px;background:rgba(33,229,138,.08);border:1px solid rgba(33,229,138,.13);overflow:hidden;white-space:nowrap}
.notice span{display:inline-block;animation:marquee 14s linear infinite;padding-left:100%}
@keyframes marquee{to{transform:translateX(-100%)}}
.leader{margin-top:12px;padding:12px 14px;display:flex;align-items:center;gap:10px}
.leaderIcon{font-size:22px}.leaderText{font-size:12px;color:var(--muted);flex:1}.leaderName{color:#fff;font-weight:800}
.quizGrid{display:grid;gap:13px}
.quizCard{min-height:155px;padding:16px;display:flex;align-items:flex-end;transition:.2s;overflow:hidden}
.quizCard:active{transform:scale(.985)}
.quizVisual{position:absolute;right:5px;top:5px;width:145px;height:145px;opacity:.92}
.quizInfo{position:relative;z-index:2;max-width:75%}
.quizIcon{font-size:28px;margin-bottom:7px}
.quizTitle{font-size:17px;font-weight:900}.quizCount{font-size:11px;color:var(--green);font-weight:800;margin-top:5px}
.primary,.secondary,.dangerBtn{width:100%;min-height:48px;border-radius:16px;font-weight:850;transition:.2s}
.primary{background:linear-gradient(135deg,#31f49b,#0da866);color:#02130c;box-shadow:0 10px 30px rgba(33,229,138,.16)}
.secondary{background:rgba(255,255,255,.065);color:#fff;border:1px solid rgba(255,255,255,.08)}
.dangerBtn{background:rgba(255,82,102,.13);color:#ff8795;border:1px solid rgba(255,82,102,.18)}
.primary:active,.secondary:active,.dangerBtn:active{transform:scale(.985)}
.bottomNav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);height:76px;padding:8px 9px calc(8px + env(safe-area-inset-bottom));background:rgba(4,12,9,.92);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.07);z-index:30;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.navBtn{background:transparent;color:var(--muted);border-radius:15px;font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.navBtn b{font-size:20px;line-height:1}.navBtn.active{background:rgba(33,229,138,.1);color:var(--green)}
.drawerShade{position:fixed;inset:0;background:rgba(0,0,0,.58);z-index:50;display:none}
.drawerShade.open{display:block}
.drawer{position:absolute;left:0;top:0;bottom:0;width:min(50%,300px);min-width:245px;background:#07120e;border-right:1px solid var(--line);padding:17px 13px;box-shadow:20px 0 50px rgba(0,0,0,.5);animation:drawerIn .25s ease}
@keyframes drawerIn{from{transform:translateX(-100%)}to{transform:none}}
.drawerHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.drawerTitle{font-size:18px;font-weight:900}.close{background:rgba(255,255,255,.06);color:#fff;width:38px;height:38px;border-radius:12px}
.drawerLink,.drawerAction{display:flex;align-items:center;gap:11px;width:100%;padding:13px;border-radius:14px;background:rgba(255,255,255,.045);color:#eafff4;margin-bottom:9px;text-align:left}
.drawerLink small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.drawerLink div{flex:1}
.formCard{padding:18px}.field{margin-bottom:13px}.field label{display:block;color:var(--muted);font-size:12px;margin:0 0 6px 3px}
.field input{width:100%;height:47px;border:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.22);border-radius:14px;color:#fff;padding:0 13px;outline:none}
.field input:focus{border-color:rgba(33,229,138,.5)}
.backRow{display:flex;align-items:center;gap:10px;margin-bottom:12px}.backBtn{background:rgba(255,255,255,.06);color:#fff;width:40px;height:40px;border-radius:12px}
.hubGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.smallQuiz{padding:15px;min-height:155px;display:flex;flex-direction:column;justify-content:space-between}
.smallQuiz .bigIcon{font-size:34px}.smallQuiz h3{margin:0;font-size:15px}.smallQuiz p{margin:4px 0 0;color:var(--muted);font-size:11px}
.levelGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.levelCard{padding:16px;min-height:145px}.levelCard.locked{opacity:.58}.levelNo{font-size:11px;color:var(--muted)}.levelName{font-size:18px;font-weight:900;margin:6px 0}.lock{font-size:25px}.levelMeta{font-size:11px;color:var(--green);margin-bottom:12px}
.quizHeader{display:flex;align-items:center;gap:10px;margin-bottom:12px}.quizHeader .backBtn{flex:none}.timer{margin-left:auto;min-width:62px;text-align:center;padding:8px 9px;border-radius:12px;background:rgba(33,229,138,.1);color:var(--green);font-weight:900}.timer.danger{background:rgba(255,82,102,.13);color:#ff8290}
.progressOuter{height:7px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}.progressInner{height:100%;background:linear-gradient(90deg,#23ed93,#0ca968);border-radius:inherit;transition:.3s}
.qMeta{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin:9px 0 15px}.qCard{padding:17px}.qText{font-size:19px;font-weight:850;line-height:1.45;margin:0 0 15px}.qImage{width:100%;max-height:190px;object-fit:cover;border-radius:15px;margin-bottom:13px;background:#0b1c15}
.optionList{display:grid;gap:9px}.option{display:flex;align-items:flex-start;gap:9px;text-align:left;width:100%;padding:13px;border-radius:15px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07);color:#fff;min-height:50px}.option .letter{width:27px;height:27px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.08);font-size:11px;font-weight:900;flex:none}.option.correct{background:rgba(33,229,138,.15);border-color:rgba(33,229,138,.5)}.option.correct .letter{background:var(--green);color:#032016}.option.wrong{background:rgba(255,82,102,.13);border-color:rgba(255,82,102,.45)}.option.wrong .letter{background:var(--danger);color:#fff}.explain{margin-top:13px;padding:12px;border-radius:14px;background:rgba(255,200,87,.07);border:1px solid rgba(255,200,87,.12);font-size:12px;color:#dce7e1;line-height:1.5}
.quizActions{margin-top:12px}.bookmarkBtn{margin-top:9px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:80;display:none;align-items:center;justify-content:center;padding:20px}.overlay.show{display:flex}.modal{width:min(430px,100%);padding:22px;text-align:center;border-radius:25px;background:#0a1913;border:1px solid var(--line);box-shadow:0 30px 90px rgba(0,0,0,.6);animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.modalIcon{font-size:52px}.modal h2{margin:8px 0 6px}.modal p{color:var(--muted);font-size:13px;line-height:1.5}.modalBtns{display:grid;gap:9px;margin-top:17px}
.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);z-index:100;background:#12261e;border:1px solid var(--line);color:#fff;padding:12px 15px;border-radius:14px;font-size:12px;opacity:0;pointer-events:none;transition:.28s;text-align:center;width:min(92%,390px);box-shadow:var(--shadow)}.toast.show{opacity:1;transform:translate(-50%,0)}
.result{text-align:center;padding:25px 17px}.scoreCircle{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;margin:8px auto 16px;background:radial-gradient(circle,#102b20 52%,transparent 54%),conic-gradient(var(--green) var(--score),rgba(255,255,255,.08) 0);border:1px solid var(--line)}.scoreCircle b{font-size:27px}.result h1{margin:0 0 5px}.result p{color:var(--muted)}
.tabs{display:flex;gap:6px;margin-bottom:13px}.tab{flex:1;padding:10px;border-radius:12px;background:rgba(255,255,255,.045);color:var(--muted);font-size:12px;font-weight:800}.tab.active{background:rgba(33,229,138,.12);color:var(--green)}
.rankRow{display:flex;align-items:center;gap:10px;padding:13px;border-bottom:1px solid rgba(255,255,255,.05)}.rankNo{width:30px;text-align:center;color:var(--green);font-weight:900}.rankName{flex:1}.rankPts{font-weight:850}.me{background:rgba(33,229,138,.08)}
.profileHero{padding:21px;text-align:center}.bigAvatar{width:80px;height:80px;border-radius:25px;margin:auto;display:grid;place-items:center;background:linear-gradient(145deg,#32f49b,#08784c);font-size:38px}.profileHero h2{margin:10px 0 2px}.profileHero .sub{margin-bottom:15px}
.statGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.statBox{padding:14px;border-radius:15px;background:rgba(255,255,255,.045)}.statBox span{display:block;color:var(--muted);font-size:11px}.statBox b{font-size:18px;display:block;margin-top:3px}
.vipGrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.vipCard{padding:15px}.vipCard.locked{opacity:.52}.vipBadge{font-size:24px}.vipCard h3{margin:7px 0 3px}.vipCard p{margin:0 0 10px;color:var(--muted);font-size:11px}
.refCode{display:flex;gap:8px;margin:13px 0}.refCode input{flex:1}.refCode button{width:52px;border-radius:13px;background:rgba(33,229,138,.12);color:var(--green)}
.bookmarkItem{padding:14px;margin-bottom:9px}.bookmarkItem h4{margin:0 0 5px}.bookmarkItem p{margin:0;color:var(--muted);font-size:11px}
.empty{text-align:center;padding:35px 15px;color:var(--muted);font-size:13px}
@media(max-width:360px){.hubGrid,.levelGrid,.vipGrid{grid-template-columns:1fr}.qText{font-size:17px}.drawer{min-width:235px}}
</style>
</head>

const categoryCounts={health:50,brain:50,general:120,bcs:130,tech:120,science:130};

function escapeSVG(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&apos;"}[m]))}
function makeImage(cat,n,text){
  const emoji={health:"🩺",brain:"🧠",general:"🌍",bcs:"📚",tech:"💻",science:"🔬"}[cat];
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360">
  <defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#0d3024"/><stop offset="1" stop-color="#06110c"/></linearGradient></defs>
  <rect width="800" height="360" rx="34" fill="url(#g)"/>
  <circle cx="400" cy="150" r="100" fill="#123c2d" stroke="#21e58a" stroke-width="5"/>
  <text x="400" y="185" text-anchor="middle" font-size="105">${emoji}</text>
  <text x="400" y="305" text-anchor="middle" fill="#eafff4" font-size="27" font-family="Arial">${escapeSVG(text)}</text>
  <text x="400" y="335" text-anchor="middle" fill="#72b99a" font-size="16" font-family="Arial">QuizMaster Visual Quiz #${n}</text>
  </svg>`;
  return "data:image/svg+xml;charset=UTF-8,"+encodeURIComponent(svg);
}
function makeQuestion(cat,i,seed){
  const base=seed[i%seed.length];
  const cycle=Math.floor(i/seed.length)+1;
  const [q,a,b,c,d,correct,exp]=base;
  const variants=[
    `${q}`,
    `${q} — প্রশ্ন সেট ${cycle}`,
    `${q} (অনুশীলন ${cycle})`,
    `${q} [চ্যালেঞ্জ ${cycle}]`
  ];
  let options=[a,b,c,d];
  const shift=(i*7+cycle)%4;
  options=options.slice(shift).concat(options.slice(0,shift));
  const obj={id:`${cat}-${i+1}`,category:cat,level:Math.floor(i/10)+1,type:"text",question:variants[i%variants.length],image:"",options,correctAnswer:correct,explanation:exp,time:30};
  /* first 200 records across image-capable categories become image quizzes */
  return obj;
}
const DB=[];
for(const [cat,count] of Object.entries(categoryCounts)){
  for(let i=0;i<count;i++){
    const q=makeQuestion(cat,i,questionBanks[cat]);
    q.type="text";
    DB.push(q);
  }
}
/* Convert exactly 200 records to image mode, distributed among visual categories. */
let converted=0;
for(const cat of ["health","brain","science","tech"]){
  const rows=DB.filter(x=>x.category===cat);
  const want=cat==="health"?50:cat==="brain"?50:cat==="science"?50:50;
  rows.slice(0,want).forEach((q,idx)=>{q.type="image";q.image=makeImage(cat,idx+1,q.question);converted++});
}
/* Data validation: exactly 600 and exact category counts. */
console.assert(DB.length===600,"Database must contain 600 questions");
console.assert(converted===200,"Image quiz target must be 200");
for(const c in categoryCounts) console.assert(DB.filter(q=>q.category===c).length===categoryCounts[c],`Count mismatch ${c}`);

function initAudio(){
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended") audioCtx.resume();
}
function snd(type="click"){
  try{
    initAudio();
    const map={click:[520,.055,"sine"],correct:[740,.13,"sine"],wrong:[180,.16,"sawtooth"],unlock:[600,.18,"triangle"],complete:[800,.24,"sine"],congrats:[960,.22,"sine"],menuOpen:[360,.08,"triangle"],menuClose:[260,.08,"triangle"],back:[300,.1,"triangle"],signout:[160,.16,"sawtooth"],start:[520,.1,"triangle"]};
    const [freq,dur,wave]=map[type]||map.click;
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=wave;o.frequency.value=freq;g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.07,audioCtx.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);
    o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur+.02);
    if(type==="correct"||type==="complete"||type==="congrats"){setTimeout(()=>tone(freq*1.25,.09),50)}
  }catch(e){}
}
function tone(freq,dur){try{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;o.type="sine";g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.06,audioCtx.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur+.02)}catch(e){}}

function startQuiz(cat,level){
 if(!isUnlocked(cat,level))return lockedToast();
 currentCat=cat;currentLevel=level;score=0;qIndex=0;answered=false;exitBackArmed=false;
 const start=DB.filter(q=>q.category===cat && q.level===level);
 /* For categories beyond 10 levels, level maps every 10 questions. */
 currentQuestions=shuffle(start).slice(0,Math.min(10,start.length)).map(q=>({...q,options:shuffle(q.options)}));
 if(!currentQuestions.length)return toast("No questions available");
 snd("start");renderQuizQuestion();showScreen("quizPlay");startTimer();
}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startTimer(){
 clearInterval(timerId);timer=30;updateTimer();timerId=setInterval(()=>{timer--;updateTimer();if(timer<=0){clearInterval(timerId);timer=0;updateTimer();timeUp()}},1000)
}
function updateTimer(){const el=document.getElementById("timer");if(el){el.textContent=timer;el.classList.toggle("danger",timer<=5)}}
function timeUp(){answered=false;snd("wrong");haptic(20);toast("⏰ Time Up — answer manually to continue")}
function renderQuizQuestion(){
 const q=currentQuestions[qIndex];if(!q)return;
 const pct=Math.round((qIndex/currentQuestions.length)*100);
 document.getElementById("quizPlay").innerHTML=`<div class="quizHeader"><button class="backBtn" onclick="requestQuizExit()">‹</button><div style="flex:1"><b>${esc(CAT[currentCat].name)}</b><div class="sub">Level ${currentLevel}</div></div><div class="timer" id="timer">${timer}</div></div>
 <div class="progressOuter"><div class="progressInner" style="width:${Math.max(10,pct)}%"></div></div>
 <div class="qMeta"><span>Question ${qIndex+1} / ${currentQuestions.length}</span><span>${pct}%</span></div>
 <div class="card qCard">
   ${q.type==="image"?`<img class="qImage" src="${q.image}" alt="Quiz visual">`:""}
   <p class="qText">${esc(q.question)}</p>
   <div class="optionList">${q.options.map((op,i)=>`<button class="option" id="opt-${i}" onclick="answerQuestion(${i})"><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(op)}</span></button>`).join("")}</div>
   <div id="explain"></div>
   <div class="quizActions" id="quizActions"></div>
   <button class="secondary bookmarkBtn" onclick="toggleBookmark('${q.id}')">${state.bookmarks.includes(q.id)?"🔖 Saved":"🔖 Bookmark"}</button>
 </div>`;
 updateTimer();
}
function answerQuestion(i){
 if(answered)return;
 snd("click");initAudio();
 const q=currentQuestions[qIndex],selected=q.options[i],btn=document.getElementById("opt-"+i);
 answered=true;clearInterval(timerId);state.stats.played++;
 if(selected===q.correctAnswer){
   score++;state.stats.correct++;state.user.points+=10;btn.classList.add("correct");snd("correct");haptic([20,30,20]);
   showMiniCongratulations();
 }else{
   state.stats.wrong++;btn.classList.add("wrong");snd("wrong");haptic(80);
   const correctIndex=q.options.indexOf(q.correctAnswer);if(correctIndex>=0)document.getElementById("opt-"+correctIndex).classList.add("correct");
   document.getElementById("explain").innerHTML=`<div class="explain"><b>Correct:</b> ${esc(q.correctAnswer)}<br>${esc(q.explanation)}</div>`;
   document.getElementById("quizActions").innerHTML=`<button class="primary" onclick="nextQuestion()">NEXT QUESTION</button>`;
 }
 saveState();
}
function showMiniCongratulations(){
 const q=currentQuestions[qIndex];
 document.getElementById("quizActions").innerHTML=`<button class="primary" onclick="nextQuestion()">CONTINUE →</button>`;
 document.getElementById("explain").innerHTML=`<div class="explain" style="border-color:rgba(33,229,138,.22);background:rgba(33,229,138,.07)"><b>🎉 ${t("অভিনন্দন! সঠিক উত্তর!","Congratulations! Correct answer!")}</b><br>${esc(q.explanation)}</div>`;
 snd("congrats");
}
function nextQuestion(){if(!answered)return toast("আগে একটি answer select করুন");if(qIndex<currentQuestions.length-1){qIndex++;answered=false;timer=30;renderQuizQuestion();startTimer()}else finishLevel()}
function finishLevel(){
 clearInterval(timerId);const completed=score===currentQuestions.length;const key=progressKey(currentCat,currentLevel);
 if(completed){
   state.progress[key]={completed:true,score,at:Date.now()};if(isUnlocked(currentCat,currentLevel+1)){ } else {state.progress[progressKey(currentCat,currentLevel+1)]={unlocked:true}}
   state.vip=Math.min(6,1+Math.floor(Object.values(state.progress).filter(x=>x.completed).length/2));
   saveState();snd("complete");showResult(true);
 }else{
   state.progress[key]={completed:false,score,at:Date.now()};saveState();showResult(false)
 }
}
function showResult(completed){
 const total=currentQuestions.length,p=Math.round(score/total*100);
 document.getElementById("result").innerHTML=`<div class="card result"><div class="scoreCircle" style="--score:${p}%"><b>${score}/${total}</b></div><h1>${completed?"🎉 LEVEL COMPLETED":"Level Not Completed"}</h1><p>${completed?"10/10 correct — next level unlocked.":"You need 10/10 correct to unlock the next level. Replay this level to try again."}</p><div class="modalBtns"><button class="primary" onclick="${completed?`showCategory('${currentCat}')`:`startQuiz('${currentCat}',${currentLevel})`}">${completed?"NEXT LEVEL":"REPLAY LEVEL"}</button><button class="secondary" onclick="showHome()">HOME</button></div></div>`;
 showScreen("result");
}
function requestQuizExit(){
 snd("back");clearInterval(timerId);
 document.getElementById("modal").innerHTML=`<div class="modal"><div class="modalIcon">⚠️</div><h2>Exit Quiz?</h2><p>আপনি কুইজ থেকে বের হয়ে হোমপেজে যাচ্ছেন। আপনার এই attempt-এর বর্তমান প্রশ্নের state reset হবে; completed level-এর saved progress থাকবে।</p><div class="modalBtns"><button class="dangerBtn" onclick="exitQuiz()">EXIT QUIZ</button><button class="secondary" onclick="closeModal();startTimer()">CANCEL</button></div></div>`;
 document.getElementById("modal").classList.add("show");
}
function exitQuiz(){closeModal();showHome();toast("আপনি কুইজ থেকে বের হয়ে হোমপেজে যাচ্ছেন।")}
function toggleBookmark(id){if(state.bookmarks.includes(id))state.bookmarks=state.bookmarks.filter(x=>x!==id);else state.bookmarks.push(id);saveState();renderQuizQuestion();toast(state.bookmarks.includes(id)?"Bookmarked":"Bookmark removed")}

/* =========================
   ANDROID BACK / BROWSER BACK
========================= */
history.replaceState({qm:"root"},"",location.href);
window.addEventListener("popstate",()=>{
 if(document.getElementById("quizPlay").classList.contains("active")){
   history.pushState({qm:"quiz"},"",location.href);requestQuizExit();
 }else{showHome()}
});
document.addEventListener("backbutton",()=>requestQuizExit());

/* =========================
   NOTICE / LEADERBOARD DEMO
========================= */
setInterval(()=>{
 leaderIndex=(leaderIndex+1)%names.length;
 const el=document.getElementById("leaderName");if(el){el.animate([{transform:"translateX(-20px)",opacity:0},{transform:"translateX(0)",opacity:1}],{duration:450});el.textContent=names[leaderIndex]}
},5000);

/* =========================
   INITIALIZE
========================= */
document.getElementById("bnBtn").classList.toggle("active",state.language==="bn");
document.getElementById("enBtn").classList.toggle("active",state.language==="en");
renderHome();
if(!state.currentUser){
 /* Keep the requested initial demo Home experience; account can be created from Sign Out. */
}
document.addEventListener("click",()=>{try{initAudio()}catch(e){}},{once:true});
</script>
</body>
